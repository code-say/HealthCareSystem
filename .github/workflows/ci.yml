name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: API (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore HealthCare.sln
      - name: Build
        run: |
          set -o pipefail
          dotnet build HealthCare.sln -c Release --no-restore -clp:NoSummary 2>&1 | tee build.log
      - name: Report build warnings
        if: always()
        run: |
          grep -E " (warning|error) [A-Z]+[0-9]+" build.log | sort -u | head -40 | while read -r line; do
            echo "::warning title=build::${line}"
          done || true
      - name: Test
        run: |
          set -o pipefail
          dotnet test HealthCare.sln -c Release --no-build --logger "console;verbosity=normal" 2>&1 | tee test.log
          grep -E "Passed!|Failed!|Total tests" test.log | head -5 | while read -r line; do echo "::notice title=tests::${line}"; done || true
      - name: Report test failures
        if: failure()
        run: |
          grep -E -A6 "^\s+Failed |Error Message|Assert\.|Exception" test.log | head -80 | while read -r line; do
            echo "::error title=test::${line}"
          done || true

  client:
    name: Client (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          grep -iE -A3 "error|failed" build.log | head -40 | while read -r line; do
            echo "::error title=client::${line}"
          done || true

  docker:
    name: API Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t healthcare-api api
