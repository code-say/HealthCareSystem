name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: API (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore HealthCare.sln
      - name: Build
        run: |
          set -o pipefail
          dotnet build HealthCare.sln -c Release --no-restore -clp:NoSummary 2>&1 | tee build.log
      - name: Report build warnings
        if: always()
        run: |
          grep -E " (warning|error) [A-Z]+[0-9]+" build.log | sort -u | head -40 | while read -r line; do
            echo "::warning title=build::${line}"
          done || true
      - name: Test
        run: |
          set -o pipefail
          dotnet test HealthCare.sln -c Release --no-build --logger "console;verbosity=normal" 2>&1 | tee test.log
          grep -E "Passed!|Failed!|Total tests" test.log | head -5 | while read -r line; do echo "::notice title=tests::${line}"; done || true
      - name: Report test failures
        if: failure()
        run: |
          grep -E -A6 "^\s+Failed |Error Message|Assert\.|Exception" test.log | head -80 | while read -r line; do
            echo "::error title=test::${line}"
          done || true

  client:
    name: Client (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          grep -iE -A3 "error|failed" build.log | head -40 | while read -r line; do
            echo "::error title=client::${line}"
          done || true

  e2e:
    name: End-to-end (API + client in a browser)
    runs-on: ubuntu-latest
    needs: [api, client]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Start API
        run: |
          ASPNETCORE_ENVIRONMENT=Development nohup dotnet run --project api/HealthCare.Api --urls http://localhost:5080 > api.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:5080/health && break; sleep 2; done
          curl -sf http://localhost:5080/health
      - name: Build and serve client
        working-directory: client
        run: |
          npm install --no-audit --no-fund
          VITE_API_URL=http://localhost:5080 npm run build
          nohup npx vite preview --port 5173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173 > /dev/null && break; sleep 1; done
      - name: Run browser flow
        working-directory: client
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          set -o pipefail
          node e2e/flow.mjs 2>&1 | tee e2e.log
      - name: Report e2e result
        if: always()
        run: |
          grep -E "▶|✅|❌|URL:|Browser errors|console:|pageerror" client/e2e.log | head -40 | while read -r line; do echo "::notice title=e2e::${line}"; done || true
          grep -iE "fail|error|exception" api.log | head -15 | while read -r line; do echo "::warning title=api-log::${line}"; done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: client/e2e-*.png
          if-no-files-found: ignore

  docker:
    name: API Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t healthcare-api api
